<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos básicos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Información del sitio -->
    <meta
        name="description"
        content="Portafolio profesional de Angel Williams Avila Arauco, especialista GIS en infraestructura, gestión de datos espaciales, automatización y Web GIS."
    >
    <meta name="author" content="Angel Williams Avila Arauco">

    <title>GEOAVILA | Soluciones GIS</title>
    <link rel="icon" href="images/logo_geoavila.png">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Righteous&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos principales -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Estilos responsivos -->
    <link rel="stylesheet" href="css/responsive.css">

    <!-- JavaScript principal -->
    <script src="js/main.js" defer></script>

</head>

<body>
    <!-- Encabezado y navegación principal -->
    <header class="site-header">
        <div class="header-container">

            <!-- Identidad -->
            <a class="site-logo" href="#inicio" aria-label="Ir al inicio">
                <span>GEO</span>AVILA
            </a>

            <!-- Acciones del encabezado -->
            <div class="header-actions">

                <!-- Cambio de tema -->
                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Activar tema claro"
                >
                    <span class="theme-icon" aria-hidden="true">☀</span>
                </button>

                <!-- Menú móvil -->
                <button
                    class="menu-toggle"
                    id="menu-toggle"
                    type="button"
                    aria-label="Abrir menú"
                    aria-controls="main-navigation"
                    aria-expanded="false"
                >
                    <span class="menu-toggle-line"></span>
                    <span class="menu-toggle-line"></span>
                    <span class="menu-toggle-line"></span>
                </button>

            </div>

            <!-- Navegación -->
            <nav
                class="main-navigation"
                id="main-navigation"
                aria-label="Navegación principal"
            >
                <ul class="navigation-list">
                    <li><a class="navigation-link" href="#inicio">Inicio</a></li>
                    <li><a class="navigation-link" href="#about">Sobre mí</a></li>
                    <li><a class="navigation-link" href="#workflow">Enfoque</a></li>
                    <li><a class="navigation-link" href="#projects">Proyectos</a></li>
                    <li><a class="navigation-link" href="#experience">Experiencia</a></li>
                    <li><a class="navigation-link" href="#contact">Contacto</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <!-- Contenido principal -->
    <main id="main-content">

        <!-- Portada -->
        <section id="inicio" class="hero">
        </section>

        <!-- Presentación profesional -->
        <section id="about" class="about-section">
        </section>

        <!-- Flujo de trabajo GIS -->
        <section id="workflow" class="workflow-section">
        </section>

        <!-- Proyectos seleccionados -->
        <section id="projects" class="projects-section">
        </section>

        <!-- Capacidades profesionales -->
        <section id="capabilities" class="capabilities-section">
        </section>

        <!-- Trayectoria profesional -->
        <section id="experience" class="experience-section">
        </section>

        <!-- Formulario y medios de contacto -->
        <section id="contact" class="contact-section">
        </section>

    </main>

    <!-- Pie de página -->
    <footer class="site-footer">
    </footer>
</body>

</html>
